name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-review:
    uses: DNJ-WholeSales/github-actions-workflows/.github/workflows/code-review.yml@main
    secrets: inherit
