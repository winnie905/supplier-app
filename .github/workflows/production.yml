name: Production

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"

          echo "version_name=$tag" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build signed Android release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleRelease

      - name: Prepare release asset
        id: asset
        shell: bash
        run: |
          asset_path="android/app/build/outputs/apk/release/apex-app-${{ steps.version.outputs.version_name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$asset_path"
          echo "asset_path=$asset_path" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-app-${{ steps.version.outputs.version_name }}-apk
          path: ${{ steps.asset.outputs.asset_path }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: apex-app ${{ steps.version.outputs.version_name }}
          files: ${{ steps.asset.outputs.asset_path }}
          generate_release_notes: true
